[project]
name = "lam-pipeline"
version = "0.1.0"
description = "Builds lesson JSON + audio for ListenAMinute Dutch"
requires-python = ">=3.12,<3.14"
dependencies = [
    "spacy>=3.8,<3.9",
    "nl-core-news-md @ https://github.com/explosion/spacy-models/releases/download/nl_core_news_md-3.8.0/nl_core_news_md-3.8.0-py3-none-any.whl",
    "wordfreq>=3.1",
    "edge-tts>=7.0",
]

[project.optional-dependencies]
# Heavy (torch). Only needed to align your own recordings: `uv sync --extra align`
align = [
    "ctc-forced-aligner @ git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git",
]

[tool.uv]
package = false
